<VirtualHost *:10000>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # No server banner details.
    ServerSignature Off

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
