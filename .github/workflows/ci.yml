name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend (TypeScript, ESLint, Prettier, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:client
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (Pint, Larastan, Pest su SQL Server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Microsoft ODBC Driver 18
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlsrv, sqlsrv, intl, mbstring
          coverage: none
          tools: composer:v2
      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: SQL Server (container usa e getta)
        run: .github/scripts/start-sqlserver.sh EdisonPortal_test
      - name: Ambiente di test
        run: |
          cp .env.example .env.testing
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/; s/^DB_DATABASE=.*/DB_DATABASE=EdisonPortal_test/' .env.testing
          php artisan key:generate --env=testing --force
      - name: Pest
        run: vendor/bin/pest

  e2e:
    name: End-to-end (Playwright, accessibilità, responsive)
    runs-on: ubuntu-24.04
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Microsoft ODBC Driver 18
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlsrv, sqlsrv, intl, mbstring
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build:client
      - name: SQL Server (container usa e getta)
        run: .github/scripts/start-sqlserver.sh EdisonPortal_e2e
      - name: Ambiente applicativo
        run: |
          cp .env.example .env
          php artisan key:generate --force
          echo "E2E_PASSWORD=E2e-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release-check:
    name: Controllo di rilascio (segnaposto e dati aziendali)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Microsoft ODBC Driver 18
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlsrv, sqlsrv, intl, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist --no-dev
      - name: SQL Server (container usa e getta)
        run: .github/scripts/start-sqlserver.sh EdisonPortal_check
      - name: Verifica dei contenuti (fallisce finché restano segnaposto)
        run: |
          cp .env.example .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=EdisonPortal_check/' .env
          php artisan key:generate --force
          php artisan migrate --force
          php artisan edison:release-check
